<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <div id="gui">
    <h1 id="site-title">Gibberish Generator</h1>
    <textarea id="input-field"> </textarea>
    <button id="gibberize">Create Gibberish</button>
    <h2 id="instructions">input text into the field to generate gibberish</h2>
    

    <div id="dropdowns">
        <select id="complexity">
            <option value="complexity: ">complexity: </option>
            <option value=1>1</option>
            <option value=2>2</option>
            <option value=3>3</option>
            <option value=4>4</option>
            <option value=5>5</option>
        </select>

        <select id="output-size">
            <option value="output size: ">output size: </option>
            <option value="short">short</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large">large</option>
            <option value="long">long</option>
        </select>

    </div>

    <textarea readonly id="output-field"> </textarea>
    <h2 id="instructions">output will go here</h2>

    </div>

    <script src="script.js"></script>
</body>
</html>
